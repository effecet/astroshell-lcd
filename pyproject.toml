[project]
name = "astroshell-lcd"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "pyserial",
    "pillow",
    "psutil",
    "pynvml",
    "pydantic-settings",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
astroshell = "astroshell.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Project is named "astroshell-lcd" but the importable package is "astroshell";
# tell hatchling explicitly so the wheel build doesn't fail on name mismatch.
[tool.hatch.build.targets.wheel]
packages = ["astroshell"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Declared explicitly instead of inherited from ruff's defaults. ruff 0.16 widened
# the default rule set, which turned CI red on files nobody had touched. This is
# the pre-0.16 default (pycodestyle errors + Pyflakes), written down so a ruff
# upgrade can no longer redefine the lint contract silently.
select = ["E4", "E7", "E9", "F"]
