display:
  port: /dev/ttyACM0
  baud: 115200
  width: 320
  height: 240
  refresh_interval: 2.0
  theme: effece
  layout: grid
  simulate: false          # true = write screencap.png instead of USB

stats:
  cpu: true
  gpu: true                # RTX 5070 via pynvml
  memory: true
  disk: true
  network: true
  temps: true

logging:
  level: INFO
  file: astroshell.log
